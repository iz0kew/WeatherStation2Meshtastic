; ============================================================================
; WeatherStation2Meshtastic — gateway sensori meteo 868 MHz -> Meshtastic
; Hardware: Heltec WiFi LoRa 32 V3 / V4 (ESP32-S3 + SX1262 + OLED)
;           Seeed XIAO nRF52840 + Wio-SX1262 Kit (senza display, feedback
;           time-sync sul LED RGB onboard — vedi src/led_status.cpp)
;           MASN — NiceNano nRF52840 + modulo LoRa HT-RA62 (nodo solare
;           open-source, senza display; PINOUT NON VERIFICATO su hardware
;           reale, vedi commento in src/board_config.h)
;
; Build modulare a due livelli di pre-build:
;   apply_settings.py     [meshtastic] -> include/user_config.h   (rete/nodo)
;   configure_sensors.py  [sensors]    -> src/config/generated_config.h (+ src_filter)
;
; Un SX1262 = un bitrate -> un environment per GRUPPO di sensori:
;   pio run -e groupA_heltec_v3 -t upload         (Fine Offset/Ecowitt + LaCrosse)
;   pio run -e groupA_heltec_v4 -t upload
;   pio run -e groupA_xiao_wiosx1262 -t upload
;   pio run -e groupA_masn_htra62 -t upload
;   pio run -e groupB_heltec_v3 -t upload         (Bresser)
;   pio run -e groupB_heltec_v4 -t upload
;   pio run -e groupB_xiao_wiosx1262 -t upload
;   pio run -e groupB_masn_htra62 -t upload
;
; La selezione dei sensori sta in settings.ini ([sensors] enabled = ...) oppure
; si genera con tools/configurator/index.html. Lo script valida che tutti i
; sensori scelti appartengano al gruppo dell'environment compilato.
;
; XIAO nRF52840 e MASN (NiceNano): al primo upload puo' servire il doppio-tap
; del tasto reset per entrare in bootloader UF2 (comportamento standard del
; bootloader Adafruit nRF52).
; ============================================================================

[platformio]
default_envs = groupA_heltec_v3

; ----------------------------------------------------------------------------
; Base comune a tutti gli environment
; ----------------------------------------------------------------------------
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Due script di pre-build coesistono (ordine: prima la rete, poi i sensori).
extra_scripts =
    pre:tools/apply_settings.py
    pre:tools/configure_sensors.py

; Footprint minimo: scarta sezioni di codice/dati non referenziate.
build_flags =
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections

; Librerie effettivamente usate dal firmware core (radio + crypto + display).
lib_deps =
    jgromes/RadioLib @ ^7.1.2
    rweather/Crypto @ ^0.4.0
    olikraus/U8g2 @ ^2.36.5

; ----------------------------------------------------------------------------
; GRUPPO A — Fine Offset / Ecowitt + LaCrosse IT+/TFA  (~17.241 kbps)
; ----------------------------------------------------------------------------
[env:groupA_heltec_v3]
board = heltec_wifi_lora_32_V3
build_flags = ${env.build_flags} -D BOARD_HELTEC_V3

[env:groupA_heltec_v4]
; La V4 e' pin-compatibile con la V3 (stesso ESP32-S3 + SX1262 + OLED);
; finche' non esiste una board definition dedicata si usa quella della V3.
board = heltec_wifi_lora_32_V3
build_flags = ${env.build_flags} -D BOARD_HELTEC_V4

; ----------------------------------------------------------------------------
; GRUPPO B — Bresser  (~8.06 kbps)
; ----------------------------------------------------------------------------
[env:groupB_heltec_v3]
board = heltec_wifi_lora_32_V3
build_flags = ${env.build_flags} -D BOARD_HELTEC_V3

[env:groupB_heltec_v4]
board = heltec_wifi_lora_32_V3
build_flags = ${env.build_flags} -D BOARD_HELTEC_V4

; ----------------------------------------------------------------------------
; Seeed XIAO nRF52840 + Wio-SX1262 Kit — nessun display, nessun tasto utente.
; Il platform ufficiale PlatformIO "nordicnrf52" non include ancora questa
; scheda: si usa il platform pubblicato da Seeed Studio.
; ----------------------------------------------------------------------------
[env:groupA_xiao_wiosx1262]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
build_flags = ${env.build_flags} -D BOARD_XIAO_WIOSX1262
lib_ignore = U8g2   ; nessun display su questa scheda

[env:groupB_xiao_wiosx1262]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-afruitnrf52-nrf52840
framework = arduino
build_flags = ${env.build_flags} -D BOARD_XIAO_WIOSX1262
lib_ignore = U8g2

; ----------------------------------------------------------------------------
; MASN — NiceNano nRF52840 + modulo LoRa HT-RA62, nessun display.
; Nessuna board "nicenano" nel platform ufficiale PlatformIO "nordicnrf52":
; si usa una board/variant LOCALE a questo progetto (boards/nicenano_masn.json
; + variants/nicenano_masn/), scritta da zero — non serve un fork esterno del
; platform (a differenza della XIAO).
; PINOUT NON VERIFICATO su hardware reale: vedi il commento nel blocco
; BOARD_MASN_HTRA62 di src/board_config.h prima di flashare.
; ----------------------------------------------------------------------------
[env:groupA_masn_htra62]
platform = nordicnrf52
board = nicenano_masn
board_build.variants_dir = variants
framework = arduino
build_flags = ${env.build_flags} -D BOARD_MASN_HTRA62
lib_ignore = U8g2   ; nessun display su questa scheda

[env:groupB_masn_htra62]
platform = nordicnrf52
board = nicenano_masn
board_build.variants_dir = variants
framework = arduino
build_flags = ${env.build_flags} -D BOARD_MASN_HTRA62
lib_ignore = U8g2
